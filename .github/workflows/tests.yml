name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The suite never reaches the network; launch only checks that a
      # key is present.
      WIRO_API_KEY: test
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep "iPhone 17 Pro" \
            || echo "iPhone 17 Pro simulator not listed"
          command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SwiftRealtime \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned: a new SwiftFormat release can add default rules and fail
      # lint on code that did not change.
      - name: Install tools
        env:
          SWIFTFORMAT_VERSION: 0.64.4
          SWIFTFORMAT_SHA256: bb42fbfb0b9d5f1b8b83db3147087220ea414916fce8c5cf71abaea5ad5a3175
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools/bin"
          curl -fsSL -o "$tools/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          curl -fsSL -o "$tools/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTFORMAT_SHA256  $tools/swiftformat.zip" | shasum -a 256 -c
          echo "$SWIFTLINT_SHA256  $tools/swiftlint.zip" | shasum -a 256 -c
          unzip -o -q "$tools/swiftformat.zip" -d "$tools/bin"
          unzip -o -q "$tools/swiftlint.zip" -d "$tools/bin"
          echo "$tools/bin" >> "$GITHUB_PATH"
          "$tools/bin/swiftformat" --version
          "$tools/bin/swiftlint" version

      - name: SwiftFormat (lint only)
        run: swiftformat SwiftRealtime Tests --lint

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: 80-column check
        run: |
          long=$(find SwiftRealtime Tests -name '*.swift' \
            -exec awk 'length > 80 {print FILENAME":"FNR}' {} +)
          if [ -n "$long" ]; then
            echo "Lines over 80 columns:"
            echo "$long"
            exit 1
          fi
