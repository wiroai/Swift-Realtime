# Style is enforced by SwiftFormat (.swiftformat); SwiftLint covers the
# semantic checks a formatter cannot. Both run in CI with --strict.
included:
  - SwiftRealtime
  - Tests

disabled_rules:
  # SwiftFormat owns layout.
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment
  - multiple_closures_with_trailing_closure
  # Doc comments in this codebase explain why; a short name is fine.
  - identifier_name
  - nesting
  # Test bodies read best as one flow.
  - function_body_length
  - type_body_length
  - file_length
  # 80 columns puts closure parameters on their own line.
  - closure_parameter_position
  # URLProtocol overrides must stay `class func`.
  - static_over_final_class

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - last_where
  - legacy_multiple
  - modifier_order
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_optional_binding
  - yoda_condition

line_length:
  warning: 80
  error: 80
  ignores_urls: true
  ignores_comments: false

cyclomatic_complexity:
  warning: 15
  error: 25

large_tuple:
  warning: 3
  error: 4
